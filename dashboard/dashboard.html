<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Mis Viajes</title>
    <link rel="stylesheet" href="../components/header/header.css">
    <link rel="stylesheet" href="dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <!-- Header Global -->
    <div id="globalHeader"></div>

    <!-- Banner offline -->
    <div class="offline-banner" id="offlineBanner">
        <span class="offline-icon">📡</span>
        <p>Modo offline - Los cambios se sincronizarán cuando tengas conexión</p>
    </div>

    <div class="dashboard-container">
        <!-- Hero con info del viaje -->
        <div class="dashboard-hero" id="dashboardHero">
            <!-- Se llenará dinámicamente -->
        </div>

        <!-- Sección de accesos rápidos (MOVIDO AQUÍ) -->
        <div class="quick-actions">
            <h2 class="section-title">⚡ Accesos Rápidos</h2>
            <div class="actions-grid" id="actionsGrid">
                <!-- Se llenará dinámicamente -->
            </div>
        </div>

        <!-- Grid de estadísticas -->
        <div class="stats-grid" id="statsGrid">
            <!-- Se llenará dinámicamente -->
        </div>

        <!-- Checklist de preparación -->
        <div class="checklist-section" id="checklistSection">
            <h2 class="section-title">📋 Checklist de Preparación</h2>
            <div class="checklist-container" id="checklistContainer">
                <!-- Se llenará dinámicamente -->
            </div>
        </div>

        <!-- Próximas actividades -->
        <div class="upcoming-section" id="upcomingSection">
            <h2 class="section-title">📅 Próximas Actividades</h2>
            <div class="upcoming-container" id="upcomingContainer">
                <!-- Se llenará dinámicamente -->
            </div>
        </div>

        <!-- Últimos gastos -->
        <div class="recent-expenses-section">
            <h2 class="section-title">💰 Últimos Gastos</h2>
            <div class="expenses-container" id="expensesContainer">
                <!-- Se llenará dinámicamente -->
            </div>
        </div>
    </div>


    <!-- Loading -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <p>Cargando dashboard...</p>
    </div>

    <!-- ======================================================
         MODAL VISOR DE DOCUMENTO (desde dashboard)
    ====================================================== -->
    <div class="modal-overlay" id="modalVisorDashboard" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:9999;align-items:center;justify-content:center;padding:16px;">
        <div style="background:#1e293b;border-radius:16px;width:100%;max-width:860px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 25px 60px rgba(0,0,0,0.5);">
            <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #334155;flex-shrink:0;">
                <h3 id="visorDashboardTitulo" style="margin:0;font-size:1rem;color:#f1f5f9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70%;">Vista previa</h3>
                <div style="display:flex;gap:8px;align-items:center;flex-shrink:0;">
                    <a id="visorDashboardDescargar" href="#" download target="_blank"
                       style="background:#334155;color:#cbd5e1;padding:6px 14px;border-radius:8px;text-decoration:none;font-size:0.85rem;font-weight:600;">⬇️ Descargar</a>
                    <a id="visorDashboardExterno" href="#" target="_blank" rel="noopener"
                       style="background:#334155;color:#cbd5e1;padding:6px 14px;border-radius:8px;text-decoration:none;font-size:0.85rem;font-weight:600;">↗️ Abrir</a>
                    <button onclick="cerrarVisorDashboard()"
                            style="background:#ef4444;color:#fff;border:none;border-radius:8px;width:32px;height:32px;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;">✕</button>
                </div>
            </div>
            <div id="visorDashboardContent" style="flex:1;overflow:auto;padding:16px;"></div>
        </div>
    </div>

    <script src="../config.js"></script>
    <script src="../components/header/header.js"></script>
    <script src="dashboard.js"></script>
</body>

</html>
