<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sin conexión — Mis Viajes</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 1.5rem;
}
.card {
    background: white; border-radius: 20px;
    padding: 2.5rem 2rem; text-align: center;
    max-width: 380px; width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
}
.icon { font-size: 4rem; margin-bottom: 1rem; }
h1 { font-size: 1.4rem; color: #1e293b; margin-bottom: .5rem; }
p  { font-size: .9rem; color: #64748b; line-height: 1.6; margin-bottom: 1.5rem; }
.btn {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white; border: none; padding: .75rem 2rem;
    border-radius: 25px; font-size: .95rem; font-weight: 700;
    cursor: pointer; width: 100%; margin-bottom: .75rem;
    transition: opacity .2s;
}
.btn:hover { opacity: .9; }
.btn-sec {
    background: #f1f5f9; color: #667eea;
    border: none; padding: .75rem 2rem;
    border-radius: 25px; font-size: .9rem; font-weight: 600;
    cursor: pointer; width: 100%;
}
.status {
    margin-top: 1.25rem; padding: .6rem 1rem;
    border-radius: 10px; font-size: .78rem;
    background: #fef9c3; color: #854d0e;
    display: none;
}
.status.online { background: #dcfce7; color: #166534; }
</style>
</head>
<body>
<div class="card">
    <div class="icon">📡</div>
    <h1>Sin conexión</h1>
    <p>Esta página no está disponible offline. Los viajes que ya visitaste siguen accesibles desde el inicio.</p>

    <button class="btn" onclick="irAlInicio()">🏠 Ir a Mis Viajes</button>
    <button class="btn-sec" onclick="reintentar()">↺ Reintentar</button>

    <div class="status" id="status"></div>
</div>

<script>
function irAlInicio() {
    // Detectar si estamos en subcarpeta
    const path = window.location.pathname;
    const base = path.includes('/ViajesAPP/') ? '/ViajesAPP/' : '/';
    window.location.href = base + 'index.html';
}

function reintentar() {
    window.location.reload();
}

// Detectar cuando vuelve la red
window.addEventListener('online', () => {
    const s = document.getElementById('status');
    s.textContent = '✅ Conexión restaurada — recargando...';
    s.className = 'status online';
    s.style.display = 'block';
    setTimeout(() => window.location.reload(), 1200);
});

window.addEventListener('offline', () => {
    const s = document.getElementById('status');
    s.textContent = '📡 Sin conexión a internet';
    s.className = 'status';
    s.style.display = 'block';
});

// Estado inicial
if (!navigator.onLine) {
    document.getElementById('status').textContent = '📡 Sin conexión a internet';
    document.getElementById('status').style.display = 'block';
}
</script>
</body>
</html>
